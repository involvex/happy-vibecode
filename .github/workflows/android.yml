name: Build Debug APK
permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Extract Latest Changelog
        run: |
          awk '/^#+ \[?[0-9]/ { if (p) exit; p=1 } p' CHANGELOG.md > latest-release.md
      - name: Running expo prebuild
        run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Make Gradle executable
        run: chmod +x ./gradlew
        working-directory: apps/mobile/android
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          body_path: latest-release.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
